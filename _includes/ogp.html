{% assign author = site.data.authors[page.author] | default: site.data.authors['default'] %}
{% assign cover = page.cover | default: site.cover %}
{% if page.layout == "post" %}
<meta property="og:type" content="article">
<meta property="article:author" content="{{ author.website }}">
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
{% for tag in page.tags %}<meta property="article:tag" content="{{ tag }}">
{% endfor %}
{% else %}
<meta property="og:type" content="website">
{% endif %}
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
{% if cover %}<meta property="og:image" content="{{ cover | absolute_url }}">{% endif %}
<link rel="author" href="{{ author.website }}">
