{% assign author = site.data.authors[page.author] | default: site.data.authors['default'] %}
{% assign cover = page.cover | default: site.cover %}
<meta name="twitter:card" content="summary_large_image">
{% if author.twitter %}<meta name="twitter:site" content="@{{ author.twitter }}">{% endif %}
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
{% if cover %}<meta name="twitter:image" content="{{ cover | absolute_url }}">{% endif %}
