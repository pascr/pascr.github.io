{% assign author = site.data.authors[page.author] | default: site.data.authors['default'] %}
{% assign cover = page.image | default: page.cover | default: site.cover %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{ author.twitter }}">
<meta name="twitter:creator" content="@{{ author.twitter }}">
<meta name="twitter:title" content="{% if page.url == '/' %}Pascal Rodriguez, CTO & Partner at Visium{% else %}{{ page.title | default: site.title | escape }}{% endif %}">
<meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
<meta name="twitter:image" content="{{ cover | absolute_url }}">
<meta name="twitter:image:alt" content="{% if page.layout == 'post' %}{{ page.title | escape }}, by Pascal Rodriguez{% else %}Pascal Rodriguez, CTO & Partner at Visium, Lausanne{% endif %}">
