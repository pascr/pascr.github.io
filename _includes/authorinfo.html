{% assign a = include.author %}
{% assign count = site.posts | where: "author", a.initial | size %}
<aside class="author-card" itemprop="author" itemscope itemtype="http://schema.org/Person">
    <img class="author-card-img" src="{{ a.picture | relative_url }}" alt="" width="400" height="400" loading="lazy" itemprop="image">
    <div class="author-card-body">
        <p class="author-card-label mono">Written by</p>
        <p class="author-card-name" itemprop="name">{{ a.name }}</p>
        <p class="author-card-bio" itemprop="description">{{ a.bio }}. {{ a.role }}.</p>
        <p class="author-card-meta mono">
            <span>{{ a.location }}</span>
            <span>{{ count }} {% if count == 1 %}post{% else %}posts{% endif %}</span>
            <a href="{{ '/' | relative_url }}" itemprop="url">About me</a>
        </p>
    </div>
</aside>
