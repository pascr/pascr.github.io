{% assign author = site.data.authors['default'] %}
{% assign current = site.data.experience | where: "current", true | first %}
<script type="application/ld+json">
{% if page.layout == "post" %}
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
  "inLanguage": "en",
  "keywords": {{ page.tags | join: ", " | jsonify }},
  "author": { "@type": "Person", "@id": "{{ '/' | absolute_url }}#pascal-rodriguez", "name": {{ author.name | jsonify }}, "url": {{ '/' | absolute_url | jsonify }} },
  "publisher": { "@type": "Person", "name": {{ author.name | jsonify }} }
}
{% else %}
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ '/' | absolute_url }}#pascal-rodriguez",
      "name": {{ author.name | jsonify }},
      "givenName": "Pascal",
      "familyName": "Rodriguez",
      "url": {{ '/' | absolute_url | jsonify }},
      "image": {{ author.picture | absolute_url | jsonify }},
      "jobTitle": "CTO & Partner",
      "description": {{ site.description | jsonify }},
      "worksFor": { "@type": "Organization", "name": "Visium SA", "url": "https://www.visium.ch/" },
      "address": { "@type": "PostalAddress", "addressLocality": "Lausanne", "addressCountry": "CH" },
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "University of Applied Sciences Western Switzerland (HES-SO)" }
      ],
      "knowsAbout": ["Agentic AI", "Generative AI", "LLM orchestration", "AI in regulated industries", "Life sciences", "Distributed systems", "Streaming architectures", "Engineering management", "Scala", "Python", "Kubernetes", "Cloud infrastructure", "Triathlon"],
      "knowsLanguage": ["fr", "en"],
      "sameAs": [
        "https://www.linkedin.com/in/{{ author.linkedin }}",
        "https://github.com/{{ author.github }}",
        "https://twitter.com/{{ author.twitter }}"
      ],
      "hasOccupation": [
        {% for job in site.data.experience %}{% for role in job.roles %}
        { "@type": "Role", "roleName": {{ role.title | jsonify }}, "description": {{ job.company | append: ", " | append: job.location | jsonify }}, "startDate": {{ role.period | split: " → " | first | replace: ".", "-" | jsonify }} }{% unless forloop.last %},{% endunless %}
        {% endfor %}{% unless forloop.last %},{% endunless %}{% endfor %}
      ]
    },
    {
      "@type": "WebSite",
      "@id": "{{ '/' | absolute_url }}#website",
      "url": {{ '/' | absolute_url | jsonify }},
      "name": {{ site.title | jsonify }},
      "description": {{ site.description | jsonify }},
      "inLanguage": "en",
      "author": { "@id": "{{ '/' | absolute_url }}#pascal-rodriguez" }
    }{% if page.url == "/" %},
    {
      "@type": "ProfilePage",
      "url": {{ '/' | absolute_url | jsonify }},
      "mainEntity": { "@id": "{{ '/' | absolute_url }}#pascal-rodriguez" }
    }{% endif %}
  ]
}
{% endif %}
</script>
