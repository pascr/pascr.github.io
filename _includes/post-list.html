<ol class="post-list" reversed>
    {% for post in include.posts %}
    <li class="post-row">
        <a class="post-row-link" href="{{ post.url | relative_url }}">
            <span class="post-row-index mono">{{ include.posts.size | minus: forloop.index0 | prepend: '0' | slice: -2, 2 }}</span>
            <span class="post-row-main">
                <span class="post-row-title">{{ post.title }}</span>
                {% if post.tags.size > 0 %}<span class="post-row-tags mono">{% for tag in post.tags %}#{{ tag }} {% endfor %}</span>{% endif %}
            </span>
            <time class="post-row-date mono" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y · %m · %d" }}</time>
            <span class="post-row-arrow" aria-hidden="true">→</span>
        </a>
    </li>
    {% endfor %}
</ol>
