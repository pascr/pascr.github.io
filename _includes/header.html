<header class="top">
    <div class="wrap top-grid">
        <a class="brand" href="{{ '/' | relative_url }}" title="{{ site.title }}" aria-label="{{ site.title }}, home">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" width="32" height="32" focusable="false">
                    <rect x="1" y="1" width="30" height="30"/>
                    <line x1="6" y1="28" x2="26" y2="4"/>
                </svg>
            </span>
            <span class="brand-text">Slice<span class="brand-slash">/</span>of<span class="brand-slash">/</span>Code</span>
        </a>

        <nav class="nav" aria-label="Primary">
            <ol>
                <li><a href="{{ '/' | relative_url }}#about" {% if page.url == "/" %}aria-current="page"{% endif %}><span class="nav-index">01</span>About</a></li>
                <li><a href="{{ '/' | relative_url }}#experience"><span class="nav-index">02</span>Experience</a></li>
                {% assign pages = site.pages | where_exp: "p", "p.menutitle" | sort: "weight" %}
                {% for p in pages %}
                {% if p.url != "/" %}
                <li><a href="{{ p.url | relative_url }}" {% if page.url == p.url %}aria-current="page"{% endif %}><span class="nav-index">{{ forloop.index | plus: 1 | prepend: '0' | slice: -2, 2 }}</span>{{ p.menutitle }}</a></li>
                {% endif %}
                {% endfor %}
            </ol>
        </nav>

        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" title="Toggle theme">
            <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4.25"/>
                <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
            </svg>
        </button>
    </div>
</header>
