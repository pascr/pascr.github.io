# Site settings
title:        Slice of Code
tagline:      Building software one slice at a time
description:  Pieces of code and reflexions about software engineering, by Pascal Rodriguez, Engineering Director in Lausanne.
keywords:     pascal rodriguez techblog scala software engineering director lausanne
language:     "en"

baseurl:      ""
url:          "https://sliceofcode.net"
permalink:    /blog/:categories/:title
cover:        /assets/alps-cover.jpg

# Build settings
markdown:     kramdown
highlighter:  rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

include: ['_pages']
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .travis.yml

plugins:
  - jekyll-mentions
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: pascr
