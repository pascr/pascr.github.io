# Site settings
title:        Slice of Code
tagline:      Building trusted AI, one slice at a time
description:  Pieces of code and reflexions about software engineering, by Pascal Rodriguez, CTO at Visium, in Lausanne.
keywords:     pascal rodriguez techblog cto software engineering ai lausanne
language:     "en"

baseurl:      ""
url:          "https://sliceofcode.net"
permalink:    /blog/:categories/:title
cover:        /assets/alps-cover.jpg

# Build settings
markdown:     kramdown
highlighter:  rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

include: ['_pages']
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .travis.yml
  - scripts

plugins:
  - jekyll-mentions
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: pascr
