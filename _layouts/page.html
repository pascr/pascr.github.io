---
layout: default
---
<article class="piece{% if page.numbered %} piece--numbered{% endif %}">
    <header class="piece-head" data-reveal>
        {% if page.kicker %}<p class="piece-kicker">{{ page.kicker }}</p>{% endif %}
        <h1 class="piece-title">{{ page.title }}</h1>
    </header>
    <div class="prose{% if page.numbered %} prose--numbered{% endif %}">
        {{ content }}
    </div>
</article>
