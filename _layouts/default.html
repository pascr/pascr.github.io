<!DOCTYPE html>
<html lang="{% if page.language %}{{ page.language | downcase }}{% else %}{{ site.language | downcase }}{% endif %}">
{% include head.html %}
<body class="layout-{{ page.layout | default: "default" }}">
    <a class="skip" href="#main">Skip to content</a>
    <div class="progress" aria-hidden="true"><span></span></div>
    {% include header.html %}
    <main id="main" class="site-main" tabindex="-1">
        {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/js/site.js' | relative_url }}" defer></script>
    {% include analytics.html %}
</body>
</html>
